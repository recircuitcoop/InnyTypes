[project]
name = "innytypes"
version = "0.1.0"
description = "Host application that wraps the Anytype desktop app and runs its features as addons."
# Pinned to ONE minor version on purpose (plan 0001). The host supervises child processes
# and loads addons from entry points; "whatever Python is on the box" is not a contract an
# addon author can target.
requires-python = "==3.13.*"
# Every runtime dependency is pinned with `==`, never `>=` (plan 0001). The host and its
# addons share one interpreter environment, so a floating range here is a floating range
# for every addon that trusts the host's API.
dependencies = [
    "click==8.5.0",
    "httpx==0.28.1",
    "platformdirs==4.11.8",
]

[project.scripts]
innytypes = "innytypes.cli:main"

[dependency-groups]
# Lint and test tools may use ranges — they never reach an addon's runtime — but every
# range carries an upper bound so a major release cannot silently change the gate.
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
    "pytest-cov>=7,<8",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/innytypes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=innytypes --cov-report=term-missing"
markers = [
    "needs_node: requires the @anyproto/anytype-mcp Node server to be installed; skipped when absent",
    "needs_anytype: requires the Anytype desktop app to be running; skipped when absent",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
# Floor set just under the measured 94% when coverage was introduced; raise it as it climbs.
fail_under = 90
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
# The CLI is the one place that is allowed to write to stdout.
"src/innytypes/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.13"
packages = ["innytypes"]
mypy_path = "src"
# strict already implies warn_unused_ignores and disallow_untyped_defs.
strict = true
