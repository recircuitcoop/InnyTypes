<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>InnyTypes</title>
  </head>
  <body>
    <header>
      <div id="status" data-testid="shell-ready">InnyTypes</div>
      <nav id="nav" data-testid="nav">
        <button type="button" data-page="editor" data-testid="nav-editor">Editor</button>
        <button type="button" data-page="inbox" data-testid="nav-inbox">
          Inbox <span id="inbox-badge" data-testid="inbox-badge"></span>
        </button>
        <button type="button" data-page="snapshots" data-testid="nav-snapshots">Snapshots</button>
        <button type="button" data-page="events" data-testid="nav-events">Events</button>
        <button type="button" data-page="jobs" data-testid="nav-jobs">Jobs</button>
        <button type="button" data-page="packages" data-testid="nav-packages">Packages</button>
        <button type="button" data-page="settings" data-testid="nav-settings">Settings</button>
        <button type="button" data-quit="1" data-testid="quit">Quit InnyTypes</button>
      </nav>
    </header>

    <section id="page-editor" data-testid="page-editor">
      <iframe
        id="editor"
        data-testid="editor"
        title="Node-RED"
        width="100%"
        height="480"
        hidden
      ></iframe>
    </section>

    <section id="page-inbox" data-testid="page-inbox" hidden>
      <h1>Inbox</h1>
      <p id="inbox-runtime"></p>
      <div id="inbox-list"></div>
      <p id="inbox-message" data-testid="inbox-message" role="status"></p>
      <div id="inbox-detail" data-testid="inbox-view"></div>
    </section>

    <section id="page-snapshots" data-testid="page-snapshots" hidden>
      <h1>Snapshots</h1>
      <p id="snapshots-runtime"></p>
      <button type="button" data-refresh="1" data-testid="snapshots-refresh">Refresh</button>
      <div id="snapshots-list"></div>
      <p id="snapshots-message" data-testid="snapshots-message" role="status"></p>
      <div id="snapshots-detail" data-testid="snapshot-view"></div>
    </section>

    <section id="page-events" data-testid="page-events" hidden>
      <h1>Events</h1>
      <p data-testid="events-placeholder">The event types you create will be listed here.</p>
    </section>

    <section id="page-jobs" data-testid="page-jobs" hidden>
      <h1>Jobs</h1>
      <p id="jobs-runtime"></p>
      <button type="button" data-refresh="1" data-testid="jobs-refresh">Refresh</button>
      <div id="jobs-list"></div>
      <p id="jobs-message" data-testid="jobs-message" role="status"></p>
    </section>

    <section id="page-packages" data-testid="page-packages" hidden>
      <h1>Packages</h1>
      <p data-testid="packages-placeholder">Installed node packages will be listed here.</p>
    </section>

    <section id="page-settings" data-testid="page-settings" hidden>
      <h1>Settings</h1>
      <div id="settings-secrets"></div>
      <h2>MCP endpoint</h2>
      <div id="settings-endpoint"></div>
      <h2>Anytype</h2>
      <div id="settings-anytype"></div>
      <p id="settings-message" data-testid="settings-message" role="status"></p>
    </section>

    <script src="app.js"></script>
  </body>
</html>
