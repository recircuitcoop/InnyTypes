id: WI-0018-27-ledger-complete
title: Every ledger row decided
intent: No behaviour may be dropped silently. The audit must also look across items, because per-item
  acceptance never asks whether items agree.
acceptance:
- tools/parity/check.ts --final passes, apart from proofs, which are WI-28 to WI-30.
- Every retirement that a person could see is listed for the owner, and owner_ack is recorded from the
  owner's answers.
- A fresh-context verifier samples 5 percent of ported rows (at least 100), breaks the implementation
  each names, and confirms the new test fails. It confirms each sampled test asserts the whole behaviour
  sentence, not one clause.
- The gate switches to --final for ledger rows.
- 'docs/loop/verify.sh exits zero and prints gate: GREEN.'
