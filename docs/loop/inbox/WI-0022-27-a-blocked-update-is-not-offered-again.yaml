id: WI-0022-27-a-blocked-update-is-not-offered-again
title: A package update that was rolled back and blocked is not offered again
intent: Found by WI-0022-21 on 2026-10-15 while rewriting package-updates.e2e, after WI-0022-19 landed; General › Packages
  still offers "Update to 0.3.0 available" with Update after a broken update was rolled back and blocked, because
  checkFacet in app/src/application/package-facets.ts reads a failed update line as available.
acceptance:
- 'After a package update fails its check and is rolled back and blocked, General › Packages shows the block with its
  reason and no Update control, until a different version is listed; checkFacet never reports a failed update as
  available; a unit test on package-facets and an e2e case in package-updates.e2e.ts prove it, and the ledger row
  test_plugin_page.py::test_a_blocked_update_is_shown_with_its_reason_and_no_apply cites that case and is no longer
  undecided.'
- 'docs/loop/verify.sh exits zero and prints gate: GREEN.'
