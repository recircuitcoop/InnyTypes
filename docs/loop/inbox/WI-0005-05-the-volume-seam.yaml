id: WI-0005-05-the-volume-seam
title: The volume seam - what is mounted, a per-platform identity reader, and the ambiguous-name refusal
intent: >-
  The application runs on macOS, Linux and Windows, so mount detection cannot lean on any one
  platform's own event mechanism - not launchd, not udev, not WMI - because three of those would
  be three code paths that drift (D8's correction). The pattern this slice follows is the one the
  project already uses for the process table and for notifications: one injected seam that answers
  what is true right now, and a factory that picks the per-platform reader and refuses a platform
  it has none for, rather than quietly answering that nothing is mounted. `VolumeProvider` answers
  what is mounted, built over `psutil.disk_partitions()` so one object works on all three
  platforms. A volume's identity - the fact matching is meant to be by, UUID first - is a separate,
  per-platform seam of its own, because psutil never gives one: `diskutil info -plist` on macOS,
  the `/dev/disk/by-uuid` symlink with a `blkid` fallback on Linux, and `GetVolumeInformationW` or
  `wmic` on Windows. Matching by UUID first is what makes duplicate names safe: two drives called
  RECORDER are one name and two disks, so a name-only match that cannot be resolved to one mounted
  volume is reported ambiguous, naming every colliding mount point, rather than guessed at. This
  slice lives in innytypes because three platforms is the host's problem, not each plugin's, and it
  needs none of the table type - it is developed and proved independently of slices 01 through 04.
acceptance:
- A `VolumeProvider` seam answers what is mounted right now as a small, platform-agnostic list -
  one entry per mounted volume, carrying at minimum its mount point and a name - built over
  `psutil.disk_partitions()` so the same object serves macOS, Linux and Windows with no platform
  branch in the caller; a test injects a fake `psutil.disk_partitions()`-shaped answer and asserts
  the resulting volumes.
- A volume's identity is read by a separate, per-platform reader, asked once per mounted volume
  per tick, never once per registered source that might be checked against it, so ten registered
  sources checked against three mounted volumes cost three identity reads, not thirty; a test
  mounts three volumes, checks five sources against them, and asserts the identity reader was
  called exactly three times.
- Three concrete identity readers exist, one per platform, each reading exactly the source the
  plan names and nothing else - macOS reads `VolumeUUID` from `diskutil info -plist <mount
  point>`; Linux resolves the symlink under `/dev/disk/by-uuid` whose target is the partition's
  device, falling back to `blkid` when no such symlink exists; Windows reads the volume serial
  number through `GetVolumeInformationW` via `ctypes`, or `wmic volume get DeviceID`; a test for
  each reader injects a fake command runner or a fake `ctypes` call, asserts the reader parses a
  recorded, realistic sample of that platform's real output into the correct identifier, and
  asserts a malformed or empty sample reads as no identifier rather than raising.
- A factory selects the identity reader for the running platform, the same pattern
  `innytypes.helper.notification.notifier_for` already uses - passed the OS name the way
  `platform.system()` spells it, it returns the matching reader for `Darwin`, `Linux` and
  `Windows`, and refuses, naming the platform, any other value, rather than returning a reader
  that silently answers no identifier for everything; a test asserts the refusal for an
  unrecognized platform name and that no reader is returned for it.
- A volume whose identity reader could not read anything never satisfies a UUID match against any
  registered source, whatever the source's declared UUID is - an unreadable identifier is not a
  wildcard - and such a volume may still be offered for a name match; a test asserts a volume with
  no readable identifier does not match a source by UUID even when the source's declared UUID
  happens to be empty or absent.
- A matcher answers one registered identity, a UUID and or a name, against the volumes currently
  mounted with exactly one of four outcomes - a UUID match naming the one volume, a name match
  naming the one volume when no UUID was given or none matched and exactly one mounted volume
  carries that name, an ambiguous name match when two or more mounted volumes share that name and
  no UUID resolved it, naming every one of the colliding mount points and not only the first, or no
  match at all; a test covers all four outcomes, and the ambiguous case in particular asserts every
  one of the at-least-two colliding mount points is named in the answer.
- UUID takes priority over name absolutely - a source whose declared UUID matches one mounted
  volume is a UUID match even when its declared name also happens to collide with a second,
  unrelated mounted volume, so the ambiguity among same-named volumes is reported only when no
  UUID resolved the source first; a test constructs exactly this scenario and asserts a UUID match,
  not an ambiguous one, is returned.
- Every one of these seams - the mounted-volumes provider, each platform's identity reader, and
  the factory's chosen reader - is injected rather than reached for directly, so this slice's
  whole test suite runs with no call to `diskutil`, no read under `/dev`, and no Windows handle
  opened; a whole-source scan test, the same style as the existing no-system-tray scan, asserts
  none of a `subprocess` call to `diskutil`, a filesystem read under `/dev/disk`, or a
  `ctypes.windll` call appears anywhere outside the three platform-reader implementations
  themselves.
- Running docs/loop/verify.sh exits zero and prints gate GREEN, with this slice needing none of
  the table type from slices 01 through 04 - it is developed and tested on its own, exactly as the
  plan's own ordering describes.
