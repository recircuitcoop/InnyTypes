id: WI-0004-03-secrets
title: Secret settings - stored outside the settings file at mode 0600, never logged, never in telemetry
intent: >-
  A secret field is the one type whose value never goes into the plugin's settings file. It goes
  where the Anytype API key goes: a file of its own, mode 0600, outside the tree, never in a log,
  never in a repr, never in telemetry (D6). The form shows only whether a secret is set, never what
  it is. This is also where the redaction function's never-sent list grows to cover plugin
  settings, with a test that plants one and proves it is stripped, the same canary-that-can-fail
  pattern the Anytype key tests already use. The operating system's keychain stays a later slice;
  this one is a file per secret, exactly as deliberate and exactly as narrow.
acceptance:
- A secret field's value is written to its own file, one file per secret, and never appears
  anywhere in the plugin's plugins/<addon-id>.toml; a test writes a secret and asserts the settings
  file's full content has no trace of the value while the secret's own file has it.
- The secret file is created at mode 0600; a test asserts the mode immediately after the write,
  using a canary that would fail if the write ever defaulted to a wider mode.
- Reading a plugin's settings never returns a secret's stored value - it reports only that the
  field is set; a test round-trips a secret write and asserts the read side reports the field as
  set without the value appearing anywhere in the returned data.
- A secret's value never appears in a log line, an exception message, or a repr of any settings
  object; a test plants a secret, forces an error path and a repr of the settings object, and
  asserts the value string is absent from both.
- The redaction function's never-sent list is extended to cover plugin settings secrets; a test
  plants a secret value inside a telemetry-shaped payload and asserts the redactor strips it before
  anything would be sent.
- Overwriting a secret's value replaces its own file atomically, the same scratch-and-rename
  discipline as the settings store; a test asserts the file's old content is fully replaced, never
  appended to or left partially written on an interrupted write.
- Every file this slice's tests touch lives under tmp_path, never the real per-user config
  directory or the real Anytype key location, and docs/loop/verify.sh exits zero and prints gate
  GREEN.
