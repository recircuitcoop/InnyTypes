id: WI-0005-05-montys-volumes-as-a-table
title: monty's volumes as a table - its own mount detection, and the deletion of monty mount, launchd and the JSON registry
intent: >-
  This is the slice that proves the table type against the case that demanded it, and, after an
  owner correction mid-plan, it is worked entirely in monty's own repository
  (/Users/martinteller/git/monty), not in innytypes. Detecting a mounted volume is monty's
  problem, not the host's: the host owns supervision, discovery, dependency resolution, the event
  bus and the addon contracts, and a VolumeProvider API in the host would be the host growing a
  feature for one plugin's need - the owner, plainly, it is not innytypes' problem to look for
  volume mounts, this is monty's problem. So monty declares its recorders as one `table` field,
  the type slices 01 through 04 add to the host's vocabulary, reads them from context.settings
  exactly as its folders already are (WI-0004-09), and does its own mount detection end to end -
  its own injected VolumeProvider seam answering what is mounted, its own per-platform identity
  readers because psutil never gives a UUID (macOS diskutil VolumeUUID, Linux the
  /dev/disk/by-uuid symlink with a blkid fallback, Windows GetVolumeInformationW or wmic), its own
  factory that refuses a platform it has no reader for rather than quietly answering that nothing
  is mounted, and its own matching that is UUID-first and reports a name that fits two mounted
  volumes as ambiguous rather than guessing which one is meant. This is the same
  seam-plus-per-platform-factory pattern the host already uses for its own process table and its
  notifications, built independently inside monty because monty cannot import innytypes and must
  not need to. It polls on its own tick instead of waiting for any operating system mount event,
  not launchd, not udev, not WMI, because three of those would be three code paths that drift, and
  it deletes monty mount, monty.triggers.launchd, monty.volumes.DiskutilVolumeProvider and
  monty.registry's JSON-backed store, none of which has anywhere left to be needed once the host
  holds the recorders and monty holds the detection. This keeps the host ignorant of drives
  permanently rather than provisionally: if a second plugin ever wants to know about a mounted
  volume, monty emits an event of its own, in its own namespace, on the bus the host already
  provides, and that plugin subscribes to it like any other kind - the owner, settling it, then
  monty will send the messages - so a volume API never has to grow in the host at all, now or
  later. This slice does not build that event; it is named here only so the reason the host stays
  out of this permanently is on the record.
acceptance:
- monty's manifest declares its recorders as one `table` field with row_label recorder, whose row
  names every field monty.domain.SourceSpec needs except id, which stays derived the same way a
  folder's id already is - label as a required text column marked unique, so two recorders cannot
  share a name, volume_uuid as an optional text column, globs as a list of text column defaulting
  to SourceSpec's own default globs, destination as a path column of kind folder, and speakers and
  language as their own columns; a test in monty's own suite asserts the declaration parses
  against the host's schema, mirroring the assertion WI-0004-09 already made for the folder and
  destination fields.
- monty reads its recorders from context.settings as a tuple of mappings, one per declared row, in
  recorded order, and never from a FileSourceRegistry, a JSON file, or any settings file of its
  own; a test asserts monty starts with two recorders declared through context.settings and both
  are visible to its own matching with nothing on disk.
- A VolumeProvider seam, owned by monty, answers what is mounted right now as a small list, one
  entry per mounted volume, carrying at minimum its mount point and a name, built over
  psutil.disk_partitions() so the same object serves macOS, Linux and Windows with no platform
  branch in the caller; a test injects a fake psutil.disk_partitions()-shaped answer and asserts
  the resulting volumes.
- A volume's identity is read by a separate, per-platform reader of monty's own, asked once per
  mounted volume per tick, never once per registered recorder that might be checked against it, so
  ten recorders checked against three mounted volumes cost three identity reads, not thirty; a
  test mounts three volumes, checks five recorders against them, and asserts the identity reader
  was called exactly three times.
- Three concrete identity readers exist, one per platform, each reading exactly the source the
  plan names and nothing else - macOS reads VolumeUUID from diskutil info -plist <mount point>;
  Linux resolves the symlink under /dev/disk/by-uuid whose target is the partition's device,
  falling back to blkid when no such symlink exists; Windows reads the volume serial number
  through GetVolumeInformationW via ctypes, or wmic volume get DeviceID; a test for each reader
  injects a fake command runner or a fake ctypes call, asserts the reader parses a recorded,
  realistic sample of that platform's real output into the correct identifier, and asserts a
  malformed or empty sample reads as no identifier rather than raising.
- A factory selects the identity reader for the running platform, the same seam-plus-factory
  pattern the host models for its own process table and notifications, built independently inside
  monty - passed the OS name the way platform.system() spells it, it returns the matching reader
  for Darwin, Linux and Windows, and refuses, naming the platform, any other value, rather than
  returning a reader that silently answers no identifier for everything; a test asserts the
  refusal for an unrecognized platform name and that no reader is returned for it.
- A volume whose identity reader could not read anything never satisfies a UUID match against any
  recorder, whatever the recorder's declared UUID is, an unreadable identifier is not a wildcard,
  and such a volume may still be offered for a name match; a test asserts a volume with no
  readable identifier does not match a recorder by UUID even when the recorder's declared UUID
  happens to be empty or absent.
- monty's matching answers one recorder's declared identity, a UUID and or a name, against the
  volumes currently mounted with exactly one of four outcomes - a UUID match naming the one
  volume, a name match naming the one volume when no UUID was declared or none matched and exactly
  one mounted volume carries that name, an ambiguous name match when two or more mounted volumes
  share that name and no UUID resolved it, naming every one of the colliding mount points and not
  only the first, or no match at all; a test covers all four outcomes, and the ambiguous case in
  particular asserts every one of the at-least-two colliding mount points is named in the answer,
  with monty flagging it for confirmation rather than guessing.
- UUID takes priority over name absolutely - a recorder whose declared UUID matches one mounted
  volume is a UUID match even when its declared name also happens to collide with a second,
  unrelated mounted volume, so the ambiguity among same-named volumes is reported only when no
  UUID resolved the recorder first; a test constructs exactly this scenario and asserts a UUID
  match, not an ambiguous one, is returned.
- monty polls its own VolumeProvider on its own tick, the same tick that already polls its watched
  folders, rather than being triggered by any operating system mount event, on all three
  platforms, one way applied to every mount detection; a test drives monty's tick with a fake
  volume provider answering a newly mounted, matching volume and asserts monty's own on_mount is
  called with that match on the very next tick, with no launchd, udev, or WMI anywhere in the
  path.
- Every one of monty's new seams, the mounted-volumes provider, each platform's identity reader,
  and the factory's chosen reader, is injected rather than reached for directly, so this slice's
  whole test suite runs with no call to diskutil, no read under /dev, and no Windows handle
  opened; a whole-source scan test asserts none of a subprocess call to diskutil, a filesystem
  read under /dev/disk, or a ctypes.windll call appears anywhere outside the three
  platform-reader implementations themselves.
- python -m monty mount, monty.triggers.launchd in full (install, uninstall, reinstall,
  build_plist, plist_path), monty.volumes.DiskutilVolumeProvider, monty.registry, and the
  install-agent, uninstall-agent and mount subcommands of monty.cli are all deleted, along with
  monty's own JSON-file-backed settings store for sources; a test scans monty's whole source tree
  and asserts no reference to launchd, launchctl, LaunchAgents, or a diskutil subprocess call
  remains anywhere outside the new identity reader.
- monty's manifest still declares host_api 2, unchanged from WI-0004-09 since context.settings
  already required it, and the whole of monty's folder-watching behaviour, its watched-folders and
  destination fields, is unaffected by this slice; a regression test from WI-0004-09's own suite
  still passes unmodified.
- Every test this slice adds is hermetic, an injected VolumeProvider, an injected host context,
  injected per-platform readers, and a temporary directory for whatever monty still writes to disk
  for its own folder-watch state, unrelated to sources, and monty's own docs/loop/verify.sh exits
  zero and prints gate GREEN, which is what closes WI-0004-09's two qualified acceptance lines,
  the JSON registry and the volume-mount feature with no vocabulary to express it, for good.
