id: WI-0018-06-secret-store
title: Secret store and the keychain-held credential secret
intent: The spike kept Node-RED's credential secret in a plain file (runtime/child.js:48-52). The Anytype
  key and proxy token must stay at their existing paths so that nothing breaks for existing users.
acceptance:
- 'The SecretStore port has two adapters: a keychain adapter (Electron safeStorage, main process only)
  and an owner-only file adapter (0600 file in a 0700 directory, as in addons/secrets.py:93-109).'
- Node-RED's credential secret is generated once, kept by the keychain adapter, and handed to the runtime
  in init. It is never written unencrypted.
- On Linux without a keyring (safeStorage backend basic_text), the file adapter is used, and the Settings
  page and the log say so once.
- The Anytype key (canonical path plus read-only legacy fallback) and mcp_proxy_token are read and written
  only through the file adapter at their existing paths.
- Ledger rows with wi = this item (no_secrets, plugin_secrets) are decided.
- 'docs/loop/verify.sh exits zero and prints gate: GREEN.'
