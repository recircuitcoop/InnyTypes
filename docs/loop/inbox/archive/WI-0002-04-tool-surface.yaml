id: WI-0002-04-tool-surface
title: Capture the pinned server's tool surface as a committed fixture
intent: >
  The server turns Anytype's OpenAPI spec into MCP tools, so the pair (package version,
  Anytype-Version) determines which tools exist. Right now nothing in this repo knows what
  that surface is, which means a version bump cannot be reviewed — there is nothing to diff.
  Record the tool list for the pinned pair as a committed fixture, and provide the comparison
  that turns an upgrade into a visible change instead of a silent one.
acceptance:
- "A committed fixture lists the tool names the pinned pair exposes, alongside the two
  version values it was captured at."
- "A refresh path regenerates that fixture by talking to the real server; it is the only
  thing in the repo that needs Node, and it is not part of the gate."
- "A pure comparison function takes two surfaces and returns added / removed / changed tool
  names; a test feeds it two hand-written surfaces and asserts all three categories, using
  no Node and no network."
- "A test asserts the fixture's recorded versions equal
  `innytypes.anytype_mcp.config.PACKAGE_VERSION` and `ANYTYPE_VERSION`, so bumping a pin
  without refreshing the fixture turns the gate red."
- "`docs/loop/verify.sh` green from a clean clone with `node_modules/` absent."
canonical_id: '0002'
canonical_source: plans
slice: '04'
status: DONE
depends_on:
- WI-0002-03-health-gated-start
notes: >
  The committed fixture is marked `source: bundled-spec`, not `live-server`, and the
  difference matters. Nobody had a running Anytype while this slice was built, so the
  surface was captured by launching the real pinned server over MCP stdio with its OpenAPI
  spec URL pointed at the document bundled in that same tarball
  (`scripts/openapi.json`, `info.version` 2025-11-08 — the pinned `ANYTYPE_VERSION`). The
  34 names and input-schema signatures are therefore the server's own `tools/list` answer
  rather than anything hand-written, but they are evidence about the pinned *package*, not
  proof that a running Anytype serves that same document. Running
  `innytypes anytype-mcp refresh-tool-surface` against a real Anytype settles it and
  rewrites the fixture as `live-server`; if the surface moves, the command prints how.
