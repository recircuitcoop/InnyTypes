id: WI-0009-03-one-file-two-writers
title: Stop the run-state file losing a record, and the MCP child leaking a grandchild
intent: Two defects the walkthrough exposed, both about processes nobody can account for. The run-state
  file is read-modify-written by the helper and the host; os.replace stops it tearing but not one
  writer dropping the other's record, and immediately after startup the MCP child's record was missing
  while that child was running and serving. The record is what lets the helper verify identity before
  signalling, so a lost one is a child that cannot be stopped safely. Separately, stopping the MCP
  child left its node grandchild alive, reparented to launchd, ignoring a polite stop - and plan 0001
  says shutdown leaves no orphan behind.
acceptance:
- Two processes writing the run-state file at once leave both records present; a test drives real
  concurrent writes rather than simulating them.
- The fix keeps the file's format, so a helper and host of different versions still read each other's
  records.
- Stopping the MCP child leaves no descendant process behind; a test asserts the whole group is gone,
  not only the tracked process.
- A descendant that ignores a polite stop is killed within the existing timeout rather than outliving
  the host.
- docs/loop/verify.sh exits zero and prints gate GREEN with no real user socket path.
canonical_id: 0009
