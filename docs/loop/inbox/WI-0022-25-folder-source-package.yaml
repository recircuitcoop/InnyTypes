id: WI-0022-25-folder-source-package
title: A first-party folder source package
intent: The starter needs a source that ships (D18); without one it cannot run and Try with a sample has nowhere to
  drop the sample.
acceptance:
- packages/folder with inny-package.json; a source that watches one folder and emits one created event per new file,
  with a debounce and partial writes ignored, in the shape of the e2e fixture source; it passes conformance against
  the reference suite; it ships inside the app beside anytype; the starter template uses it as its source and passes
  the check; flows.e2e.ts makes a flow from the starter, sets its folder (as Setup's Source folder step does) and then
  reads "1 step not set up" (the Anytype step), then Ready once the space is set too; and the inverse, the space set
  with no folder, reads "1 step not set up" (the source). Every unconfigured node counts, the source included
  (docs/ux/interaction-design.md, "No folder chosen yet"). Wording clarified 2026-10-14.
- 'docs/loop/verify.sh exits zero and prints gate: GREEN.'
